<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A1D;
    --turf:#26402C;
    --turf-deep:#152119;
    --turf-mid:#5C7F5E;
    --paper:#F5F0E1;
    --paper-line:#DECDA0;
    --sand:#D8C69C;
    --flag:#B5432E;
    --flag-dark:#8F3423;
    --white:#FFFDF7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Big Shoulders Display', sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* Header */
  @supports (padding: env(safe-area-inset-top)){
    header.top{padding-top:calc(28px + env(safe-area-inset-top));}
    body{padding-bottom:env(safe-area-inset-bottom);}
  }
  header.top{
    background:linear-gradient(180deg, var(--turf) 0%, var(--turf-deep) 100%);
    color:var(--white);
    padding:28px 20px 0;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .top-inner{max-width:880px; margin:0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sand);
    margin:0 0 6px;
  }
  h1.title{
    font-size:clamp(28px, 6vw, 44px);
    margin:0 0 4px;
    line-height:0.95;
  }
  .subtitle{
    color:#CFE0CE;
    font-size:14px;
    margin:0 0 20px;
    max-width:52ch;
  }

  /* Tabs styled like scorecard tee markers */
  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:0;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:#CFE0CE;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:10px 16px 12px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{background:rgba(255,255,255,0.06); color:var(--white);}
  .tab-btn.active{
    background:var(--paper);
    color:var(--turf-deep);
    border-bottom-color:var(--flag);
    font-weight:600;
  }
  .tab-btn:focus-visible{outline:2px solid var(--sand); outline-offset:2px;}

  main{max-width:880px; margin:0 auto; padding:28px 20px 80px;}
  .panel{display:none; animation:fadein 0.25s ease;}
  .panel.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .panel{animation:none;}
    html{scroll-behavior:auto;}
  }

  /* Cards */
  .card{
    background:var(--white);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 22px 20px;
    margin-bottom:18px;
    position:relative;
  }
  .card h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.01em;
    font-size:22px;
    margin:0 0 4px;
    color:var(--turf-deep);
  }
  .card .focus{
    font-size:14.5px;
    color:#4B4536;
    margin:0 0 16px;
    max-width:60ch;
  }
  .week-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:var(--sand);
    color:var(--turf-deep);
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:10px;
  }

  /* Week pills + day tabs within a phase */
  .week-pills{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:2px 0 4px;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .week-pills::-webkit-scrollbar{display:none;}
  .week-pill{
    flex:0 0 auto;
    background:var(--white);
    border:1px solid var(--paper-line);
    color:#6B6550;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .week-pill:hover{border-color:var(--turf-mid); color:var(--turf-deep);}
  .week-pill.active{background:var(--turf); border-color:var(--turf); color:var(--white);}
  .week-pill:focus-visible{outline:2px solid var(--flag); outline-offset:2px;}

  .day-tabs{
    display:flex;
    gap:2px;
    overflow-x:auto;
    border-bottom:1px solid var(--paper-line);
    margin:14px 0 0;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    padding:8px 13px 9px;
    cursor:pointer;
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:2px;
    position:relative;
    transition:border-color 0.15s ease;
  }
  .day-tab .dt-day{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#A39B84;
  }
  .day-tab .dt-tag{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:14px;
    letter-spacing:0.02em;
    color:#6B6550;
    white-space:nowrap;
  }
  .day-tab:hover .dt-tag{color:var(--turf-deep);}
  .day-tab.active{border-bottom-color:var(--flag);}
  .day-tab.active .dt-day{color:var(--turf-mid);}
  .day-tab.active .dt-tag{color:var(--turf-deep);}
  .day-tab:focus-visible{outline:2px solid var(--turf); outline-offset:-2px;}
  .dt-dot{
    position:absolute;
    top:5px; right:6px;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--turf-mid);
  }

  /* Club-aware scoring */
  .sr-club{
    display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
    padding-bottom:11px; margin-bottom:11px;
    border-bottom:1px solid rgba(255,255,255,0.16);
  }
  .sr-club-label{font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:#A9C0A7;}
  .sr-club-name{font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:30px; line-height:0.9; color:var(--white);}
  .sr-club-prog{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--sand); margin-left:auto;}
  .club-bar{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px;}
  .club-chip{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600;
    padding:6px 9px; border-radius:6px; cursor:pointer;
    border:1px solid var(--paper-line); background:var(--white); color:#6B6550;
    display:inline-flex; align-items:center; gap:4px;
  }
  .club-chip:hover{border-color:var(--turf-mid);}
  .club-chip.current{background:var(--turf); border-color:var(--turf); color:var(--white);}
  .club-chip.complete{background:rgba(92,127,94,0.16); border-color:var(--turf-mid); color:var(--turf-deep);}
  .club-chip .cc-n{font-size:9px; opacity:0.75;}
  .club-chip:focus-visible{outline:2px solid var(--flag); outline-offset:2px;}
  .shot-dot{min-width:24px; width:auto; padding:0 5px; font-size:9.5px;}

  .club-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:4px 0 6px;}
  @media (max-width:560px){ .club-grid{grid-template-columns:repeat(3, 1fr);} }
  .club-cell{
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    padding:9px 10px; border-radius:8px; cursor:pointer; text-align:left;
    border:1px solid var(--paper-line); background:var(--paper);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .club-cell:hover{border-color:var(--turf-mid);}
  .club-cell.active{border-color:var(--turf); background:rgba(38,64,44,0.06);}
  .club-cell:focus-visible{outline:2px solid var(--turf); outline-offset:2px;}
  .cg-club{font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.04em; color:#6B6550;}
  .cg-val{font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:20px; line-height:1; color:var(--turf-deep);}
  .cg-val.neg{color:var(--flag-dark);}
  .cg-empty{font-family:'IBM Plex Mono', monospace; font-size:10px; color:#A39B84; padding:5px 0;}
  .cg-n{font-family:'IBM Plex Mono', monospace; font-size:9px; color:#A39B84;}
  svg.spark{width:100%; height:22px; display:block; margin:2px 0 1px;}
  .club-detail{border-top:1px dashed var(--paper-line); padding-top:14px; margin-top:12px;}

  /* Scoring block */
  .score-readout{
    background:var(--turf-deep); color:var(--white);
    border-radius:9px; padding:14px 16px; margin:4px 0 14px;
  }
  .sr-main{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
  .sr-value{
    font-family:'Big Shoulders Display', sans-serif; font-weight:900;
    font-size:40px; line-height:0.9; color:var(--sand);
  }
  .sr-label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; color:#CFE0CE;}
  .sr-split{display:flex; gap:18px; flex-wrap:wrap; margin-top:11px;}
  .sr-stat{display:flex; flex-direction:column; font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#A9C0A7;}
  .sr-stat b{font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:19px; letter-spacing:0; color:var(--white); text-transform:none;}
  .sr-stat.warn b{color:#E8A08D;}
  .sr-done{
    margin-top:11px; padding-top:9px; border-top:1px solid rgba(255,255,255,0.16);
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--sand);
  }
  .grade-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .grade-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:12px 13px; border-radius:9px; cursor:pointer; text-align:left;
    border:1px solid var(--paper-line); background:var(--paper);
    transition:transform 0.08s ease, background 0.15s ease;
  }
  .grade-btn:active{transform:scale(0.97);}
  .grade-btn.good{border-color:var(--turf); background:rgba(38,64,44,0.07);}
  .grade-btn.ok{border-color:var(--turf-mid); background:rgba(92,127,94,0.06);}
  .grade-btn.miss{border-color:var(--sand);}
  .grade-btn.mishit{border-color:var(--flag); background:rgba(181,67,46,0.05);}
  .gb-val{font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:22px; line-height:1; color:var(--turf-deep);}
  .grade-btn.mishit .gb-val{color:var(--flag-dark);}
  .gb-label{font-size:12.5px; font-weight:500; color:var(--ink); line-height:1.25;}
  .gb-hint{font-size:10.5px; color:#8C8672; line-height:1.2;}
  .grade-btn:focus-visible{outline:2px solid var(--turf); outline-offset:2px;}
  .shot-history{display:flex; flex-wrap:wrap; gap:4px; margin-top:12px; min-height:4px;}
  .shot-dot{
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600;
    width:24px; height:22px; display:flex; align-items:center; justify-content:center;
    border-radius:4px; color:var(--white);
  }
  .shot-dot.good{background:var(--turf);}
  .shot-dot.ok{background:var(--turf-mid);}
  .shot-dot.miss{background:#B8A87E; color:var(--turf-deep);}
  .shot-dot.mishit{background:var(--flag);}
  .score-actions{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap;}
  .score-actions .btn{align-self:auto;}
  .prior-blocks{
    display:flex; flex-direction:column; gap:5px;
    margin-top:15px; padding-top:12px; border-top:1px dashed var(--paper-line);
  }
  .prior-label{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.09em; text-transform:uppercase; color:#8C8672;}
  .prior-chip{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#6B6550;}

  /* Embedded pre-round warm-up */
  .wu-toggle{
    width:100%;
    display:flex; align-items:center; gap:10px;
    background:transparent; border:none; padding:0; cursor:pointer; text-align:left;
  }
  .wu-toggle-label{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    text-transform:uppercase; font-size:19px; color:var(--turf-deep);
  }
  .wu-toggle-meta{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:#6B6550; margin-left:auto; white-space:nowrap;
  }
  .wu-chevron{
    font-size:13px; color:var(--turf-mid); transition:transform 0.2s ease; flex:0 0 auto;
  }
  .wu-chevron.open{transform:rotate(180deg);}
  .wu-toggle:focus-visible{outline:2px solid var(--turf); outline-offset:3px;}
  .wu-body{margin-top:12px;}
  .wu-block{border-top:1px dashed var(--paper-line); padding:12px 0 2px;}
  .wu-block:first-child{border-top:none; padding-top:2px;}
  .wu-block-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:3px;}
  .wu-block-name{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    text-transform:uppercase; font-size:15px; color:var(--turf-deep);
  }
  .wu-block-time{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:0.08em; text-transform:uppercase;
    background:var(--sand); color:var(--turf-deep);
    padding:2px 8px; border-radius:20px;
  }
  .wu-block-note{font-size:12.5px; color:#6B6550; margin:0 0 8px; max-width:60ch;}
  .wu-late{
    font-size:12.5px; color:#6B6550;
    background:var(--paper); border:1px solid var(--paper-line);
    border-radius:8px; padding:10px 13px; margin-top:12px;
  }
  .wu-late strong{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--turf-deep);
    display:block; margin-bottom:3px;
  }

  /* Day blocks within a week card */
  .day-block{
    border-top:1px solid var(--paper-line);
    padding:16px 0 6px;
  }
  .day-block:first-of-type{border-top:none; padding-top:4px;}
  .day-head{
    display:flex;
    align-items:baseline;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:4px;
  }
  .day-name{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--white);
    background:var(--turf-mid);
    padding:3px 9px;
    border-radius:20px;
    flex:0 0 auto;
  }
  .day-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:16px;
    color:var(--turf-deep);
  }
  .day-focus{
    font-size:13px;
    color:#5C5640;
    margin:0 0 10px;
    max-width:60ch;
  }

  /* Checklist styled like scorecard tally boxes */
  ul.drills{list-style:none; margin:0; padding:0;}
  ul.drills li{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 0;
    border-bottom:1px dashed var(--paper-line);
  }
  ul.drills li:last-child{border-bottom:none;}
  .check-box{
    flex:0 0 22px;
    width:22px;
    height:22px;
    border:2px solid var(--turf-mid);
    border-radius:4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--white);
    transition:background 0.12s ease, border-color 0.12s ease;
    margin-top:1px;
  }
  .check-box.checked{background:var(--turf); border-color:var(--turf);}
  .check-box.checked::after{
    content:'✓';
    color:var(--white);
    font-size:14px;
    font-weight:700;
    line-height:1;
  }
  .drill-label{font-size:14.5px; cursor:pointer; user-select:none; flex:1 1 0; min-width:0;}
  .drill-label.done{color:#8C8672; text-decoration:line-through;}

  /* Quality shot stepper */
  .qty{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:5px;
    margin-left:auto;
    padding-left:10px;
  }
  .qty-btn{
    width:22px; height:22px;
    border:1px solid var(--paper-line);
    background:var(--paper);
    color:var(--turf-deep);
    border-radius:5px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    padding:0;
  }
  .qty-btn:hover{background:var(--sand);}
  .qty-btn:focus-visible{outline:2px solid var(--turf); outline-offset:1px;}
  .qty-readout{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#6B6550;
    min-width:44px;
    text-align:center;
    white-space:nowrap;
  }
  .qty-readout.hit{color:var(--turf); font-weight:600;}
  @media (max-width:520px){
    ul.drills li{flex-wrap:wrap;}
    .qty{flex:0 0 100%; margin-left:34px; padding-left:0; margin-top:6px; justify-content:flex-start;}
  }

  .firsttee{
    display:flex; flex-direction:column; gap:3px;
    border-left:3px solid var(--flag);
    background:rgba(181,67,46,0.05);
    padding:11px 14px;
    border-radius:0 8px 8px 0;
    margin-top:12px;
  }
  .ft-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--flag-dark);
  }
  .ft-text{font-size:14.5px; color:var(--ink); font-weight:500;}

  .log-section{
    border-top:1px solid var(--paper-line);
    padding-top:14px;
    display:flex; flex-direction:column; gap:13px;
  }
  .log-section:first-child{border-top:none; padding-top:0;}
  .log-section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--flag-dark); margin:0;
  }
  .f2p-box{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    background:var(--paper); border:1px solid var(--paper-line);
    border-radius:8px; padding:11px 14px;
  }
  .f2p-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; color:#6B6550;
  }
  .f2p-value{
    font-family:'Big Shoulders Display', sans-serif; font-weight:900;
    font-size:26px; line-height:1; color:var(--turf-deep);
  }
  .f2p-note{font-size:12.5px; color:#6B6550;}
  .session-meta{font-size:12.5px; color:#6B6550; margin:5px 0 0;}
  .flag-chip.strong{background:var(--turf); color:var(--white); border-color:var(--turf); font-weight:600;}
  .note-key{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:0.06em; text-transform:uppercase; color:#8C8672;
  }

  .score-trend{border-top:1px dashed var(--paper-line); padding-top:14px; margin-top:14px;}
  .score-trend:first-of-type{border-top:none; padding-top:2px; margin-top:2px;}
  .st-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .st-name{font-family:'Big Shoulders Display', sans-serif; font-weight:700; text-transform:uppercase; font-size:17px; color:var(--turf-deep);}
  .st-meta{font-family:'IBM Plex Mono', monospace; font-size:11px; color:#6B6550;}

  .week-grid td, .week-grid th{text-align:center; font-family:'IBM Plex Mono', monospace; font-size:12.5px;}
  .week-grid th:first-child, .week-grid td:first-child{text-align:left;}
  .wg-week{font-weight:600; color:var(--turf-deep);}
  .wg-pos{color:var(--turf); font-weight:600;}
  .wg-neg{color:var(--flag-dark); font-weight:600;}
  .wg-empty{color:#C4BCA4;}

  .prior-row{display:flex; align-items:center; gap:8px;}
  .prior-del{
    background:transparent; border:none; cursor:pointer;
    color:#A39B84; font-size:17px; line-height:1; padding:0 4px;
    font-family:'IBM Plex Mono', monospace;
  }
  .prior-del:hover{color:var(--flag);}
  .prior-del:focus-visible{outline:2px solid var(--flag); outline-offset:2px;}
  .saved-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border-top:1px solid var(--paper-line); padding:11px 0;
  }
  .saved-row:first-of-type{border-top:none;}
  .saved-left{display:flex; flex-direction:column; gap:2px; flex:1 1 200px; min-width:0;}
  .saved-meta{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700;
    text-transform:uppercase; font-size:15px; color:var(--turf-deep);
  }
  .saved-stats{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#6B6550;}
  .clear-wrap{margin-top:16px; padding-top:13px; border-top:1px dashed var(--paper-line);}

  .storage-mode{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    color:#8C8672; margin:12px 0 0;
  }

  /* Charts */
  .chart-wrap{margin:6px 0 2px;}
  .chart-wrap svg{width:100%; height:auto; display:block;}
  .chart-caption{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#8C8672;
    margin:2px 0 0;
  }
  .hcp-hero{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    padding:4px 0 14px;
  }
  .hcp-value{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900;
    font-size:54px;
    line-height:0.85;
    color:var(--turf-deep);
  }
  .hcp-meta{font-size:13px; color:#6B6550; max-width:36ch;}
  .hcp-delta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:3px 9px;
    border-radius:20px;
    background:var(--sand);
    color:var(--turf-deep);
  }
  .hcp-delta.down{background:var(--turf); color:var(--white);}
  .round-entry{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; flex-wrap:wrap;
    border-top:1px solid var(--paper-line);
    padding:11px 0;
  }
  .round-entry:first-child{border-top:none;}
  .round-score{font-family:'Big Shoulders Display'; font-weight:700; font-size:22px; color:var(--turf-deep); line-height:1;}
  .round-meta{font-size:12.5px; color:#6B6550;}
  .round-diff{font-family:'IBM Plex Mono', monospace; font-size:12px; color:#8C8672;}
  .four-col{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;}
  .three-col{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;}
  @media (max-width:560px){
    .four-col{grid-template-columns:1fr 1fr;}
    .three-col{grid-template-columns:1fr;}
  }

  /* Progress bar */
  .progress-track{
    height:8px;
    background:var(--paper-line);
    border-radius:6px;
    overflow:hidden;
    margin-top:6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--sand), var(--turf));
    border-radius:6px;
    transition:width 0.3s ease;
  }
  .progress-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .progress-label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#6B6550;}

  /* Overview */
  .overview-hero{
    background:var(--turf-deep);
    color:var(--white);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:18px;
  }
  .overview-hero h2{color:var(--white); font-family:'Big Shoulders Display'; font-size:20px; text-transform:uppercase; margin:0 0 10px;}
  .overview-hero p{font-size:14px; color:#D8E3D6; margin:0 0 10px;}
  .overview-hero p:last-child{margin-bottom:0;}
  .overview-hero strong{color:var(--sand);}

  table.structure{width:100%; border-collapse:collapse; font-size:14px;}
  table.structure th, table.structure td{
    text-align:left;
    padding:9px 8px;
    border-bottom:1px solid var(--paper-line);
  }
  table.structure th{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#6B6550;
  }

  /* Session log */
  form.log-form{display:flex; flex-direction:column; gap:14px;}
  .form-row{display:flex; flex-direction:column; gap:5px;}

  // Storage: localStorage when hosted on a real origin (GitHub Pages), falling back
  // to the artifact sandbox API, then to memory. Keeps one call signature everywhere.
  var storage = (function(){
    var PREFIX = 'golf-program:';
    var mem = {};
    var hasLocal = (function(){
      try{
        var k = '__probe__';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        return true;
      }catch(e){ return false; }
    })();
    var hasSandbox = !!(window.storage && typeof window.storage.get === 'function');

    return {
      mode: hasLocal ? 'localStorage' : (hasSandbox ? 'sandbox' : 'memory'),
      get: async function(key){
        if(hasLocal){
          var v = window.localStorage.getItem(PREFIX + key);
          return v === null ? null : {key:key, value:v};
        }
        if(hasSandbox) return await window.storage.get(key);
        return mem[key] === undefined ? null : {key:key, value:mem[key]};
      },
      set: async function(key, value){
        if(hasLocal){
          window.localStorage.setItem(PREFIX + key, value);
          return {key:key, value:value};
        }
        if(hasSandbox) return await window.storage.set(key, value);
        mem[key] = value;
        return {key:key, value:value};
      },
      // Everything the app persists, for backup/restore
      dump: function(){
        var out = {};
        Object.keys(STORAGE_KEYS).forEach(function(k){
          var key = STORAGE_KEYS[k];
          var v = hasLocal ? window.localStorage.getItem(PREFIX + key) : mem[key];
          if(v !== null && v !== undefined) out[key] = v;
        });
        return out;
      },
      restore: function(obj){
        Object.keys(obj || {}).forEach(function(key){
          if(hasLocal) window.localStorage.setItem(PREFIX + key, obj[key]);
          else mem[key] = obj[key];
        });
      }
    };
  })();

  // Pull a rep target out of drill text where one is stated, e.g. "15 reps", "12 balls", "10 putts"

  function allDrillIds(phase){

      g.days.forEach(function(day, di){

      });

  function phaseProgress(phase){
    var ids = allDrillIds(phase);
    if(ids.length === 0) return 0;
    var done = ids.filter(function(id){ return !!state.checklist[id]; }).length;
    return Math.round((done/ids.length) * 100);
  }

  function overallProgress(){
    var total = 0, done = 0;
    PHASES.forEach(function(p){
      var ids = allDrillIds(p);
      total += ids.length;
      done += ids.filter(function(id){ return !!state.checklist[id]; }).length;
    });
    return total ? Math.round((done/total)*100) : 0;
  }

  // Live scoring block: tap one grade per shot, fixed shot count for comparability
  function renderScoringBlock(container, rubricId, dayKey, ctx){
    ctx = ctx || {};
    var R = SCORING[rubricId];
    if(!R) return;
    var liveKey = dayKey + '-' + rubricId;
    if(!state.liveShots[liveKey]) state.liveShots[liveKey] = [];

    var card = el('div','card');
    var head = el('div','day-head');
    head.innerHTML = '<span class="day-name">SCORING</span>' +
                     '<span class="day-title">' + R.name + ' \u00b7 ' + R.shots + ' shots</span>';
    card.appendChild(head);
    card.appendChild(el('p','day-focus', R.note));

    var readout = el('div','score-readout');
    var clubBar = R.byClub ? el('div','club-bar') : null;
    var grid = el('div','grade-grid');
    var history = el('div','shot-history');
    var actions = el('div','score-actions');

    // Which club is up next: fill 2 shots per club in bag order
    function currentClubIndex(){
      var shots = state.liveShots[liveKey];
      if(state.manualClub[liveKey] !== undefined && state.manualClub[liveKey] !== null){
        return state.manualClub[liveKey];
      }
      var idx = Math.floor(shots.length / SHOTS_PER_CLUB);
      return Math.min(idx, CLUBS.length - 1);
    }

    function clubShotCount(club){
      return state.liveShots[liveKey].filter(function(s){
        return s && typeof s === 'object' && s.club === club;
      }).length;
    }

    function paint(){
      var shots = state.liveShots[liveKey];
      var st = scoreStats(shots);
      var remaining = Math.max(0, R.shots - st.count);
      var ci = R.byClub ? currentClubIndex() : null;
      var club = R.byClub ? CLUBS[ci] : null;

      readout.innerHTML =
        (R.byClub
          ? '<div class="sr-club"><span class="sr-club-label">Now hitting</span>' +
            '<span class="sr-club-name">' + club + '</span>' +
            '<span class="sr-club-prog">' + clubShotCount(club) + '/' + SHOTS_PER_CLUB + ' shots</span></div>'
          : '') +
        '<div class="sr-main"><span class="sr-value">' + (st.total > 0 ? '+' : '') + st.total + '</span>' +
          '<span class="sr-label">points \u00b7 ' + st.count + '/' + R.shots + ' shots</span></div>' +
        '<div class="sr-split">' +
          '<span class="sr-stat"><b>' + (st.pps > 0 ? '+' : '') + st.pps.toFixed(2) + '</b>per shot</span>' +
          '<span class="sr-stat"><b>' + st.goodPct + '%</b>best grade</span>' +
          '<span class="sr-stat' + (st.mishitPct >= 20 ? ' warn' : '') + '"><b>' + st.mishitPct + '%</b>mishit rate</span>' +
        '</div>' +
        (remaining === 0 ? '<div class="sr-done">Block complete \u2014 save it below.</div>' : '');

      if(clubBar){
        clubBar.innerHTML = '';
        CLUBS.forEach(function(c, i){
          var n = clubShotCount(c);
          var cls = 'club-chip';
          if(i === ci) cls += ' current';
          else if(n >= SHOTS_PER_CLUB) cls += ' complete';
          var b = el('button', cls, c + (n ? '<span class="cc-n">' + n + '</span>' : ''));
          b.type = 'button';
          b.addEventListener('click', function(){
            state.manualClub[liveKey] = i;
            paint();
          });
          clubBar.appendChild(b);
        });
      }

      history.innerHTML = '';
      shots.forEach(function(s){
        var v = (typeof s === 'object' && s !== null) ? s.v : s;
        var lbl = (typeof s === 'object' && s !== null) ? s.club : (v > 0 ? '+' + v : String(v));
        var cls = v === 2 ? 'good' : v === 1 ? 'ok' : v === -1 ? 'miss' : 'mishit';
        var dot = el('span','shot-dot ' + cls, lbl);
        dot.title = (v > 0 ? '+' : '') + v;
        history.appendChild(dot);
      });
    }

    R.grades.forEach(function(g){
      var b = el('button','grade-btn ' + g.kind);
      b.type = 'button';
      b.innerHTML = '<span class="gb-val">' + (g.v > 0 ? '+' + g.v : g.v) + '</span>' +
                    '<span class="gb-label">' + g.label + '</span>' +
                    (g.hint ? '<span class="gb-hint">' + g.hint + '</span>' : '');
      b.addEventListener('click', function(){
        if(R.byClub){
          var ci = currentClubIndex();
          state.liveShots[liveKey].push({club: CLUBS[ci], v: g.v});
          // auto-advance once this club has its two shots
          if(clubShotCount(CLUBS[ci]) >= SHOTS_PER_CLUB && ci < CLUBS.length - 1){
            state.manualClub[liveKey] = null;
          }
        } else {
          state.liveShots[liveKey].push(g.v);
        }
        paint();
      });
      grid.appendChild(b);
    });

    var undo = el('button','btn ghost','Undo Last');
    undo.type='button';
    undo.addEventListener('click', function(){
      state.liveShots[liveKey].pop();
      state.manualClub[liveKey] = null;
      paint();
    });

    var save = el('button','btn','Save Block');
    save.type='button';

      setTimeout(function(){ status.textContent=''; }, 2500);

  function renderDayContent(container, phase, group, groupIndex, dayIndex, headerCard){
    var day = group.days[dayIndex];

    var card = el('div','card');

    var ul = el('ul','drills');
    day.drills.forEach(function(d, i){
      var id = group.id + '-' + dayIndex + '-' + i;
      var li = el('li');
      var box = el('div','check-box' + (state.checklist[id] ? ' checked' : ''));
      box.setAttribute('role','checkbox');
      box.setAttribute('aria-checked', state.checklist[id] ? 'true' : 'false');
      box.setAttribute('tabindex','0');
      var label = el('span','drill-label' + (state.checklist[id] ? ' done' : ''), d);

      function toggle(){
        state.checklist[id] = !state.checklist[id];
        box.classList.toggle('checked');
        box.setAttribute('aria-checked', state.checklist[id] ? 'true' : 'false');
        label.classList.toggle('done');
        saveChecklist();
        var pct2 = phaseProgress(phase);
        var fill = headerCard.querySelector('.progress-fill');
        var pctText = headerCard.querySelector('.progress-row .mono');
        if(fill) fill.style.width = pct2 + '%';
        if(pctText) pctText.textContent = pct2 + '%';
        // refresh the completion dot on this day's tab
        var tabBtn = document.querySelector('.day-tab[data-day="' + dayIndex + '"]');
        if(tabBtn){
          var existing = tabBtn.querySelector('.dt-dot');
          var done = dayComplete(group.id, dayIndex, day);
          if(done && !existing) tabBtn.appendChild(el('span','dt-dot'));
          if(!done && existing) existing.remove();
        }
      }
      box.addEventListener('click', toggle);
      box.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle(); }
      });
      label.addEventListener('click', toggle);

      li.appendChild(label);

      // Quality shot counter
      var target = repTarget(d);
      var qtyWrap = el('div','qty');
      var minus = el('button','qty-btn','\u2212');
      minus.type='button';
      minus.setAttribute('aria-label','One fewer quality shot');
      var readout = el('span','qty-readout');
      var plus = el('button','qty-btn','+');
      plus.type='button';
      plus.setAttribute('aria-label','One more quality shot');

      function paint(){
        var n = state.quality[id] || 0;
        readout.textContent = target ? (n + '/' + target) : String(n);
        readout.classList.toggle('hit', !!target && n >= target);
      }
      function bump(delta){
        var n = (state.quality[id] || 0) + delta;
        if(n < 0) n = 0;
        state.quality[id] = n;
        paint();
        saveQuality();
      }
      minus.addEventListener('click', function(){ bump(-1); });
      plus.addEventListener('click', function(){ bump(1); });
      paint();

      qtyWrap.appendChild(minus);
      qtyWrap.appendChild(readout);
      qtyWrap.appendChild(plus);
      li.appendChild(qtyWrap);
      ul.appendChild(li);
    });

  /* ---------- Handicap (World Handicap System) ---------- */

  // Score Differential = (113 / Slope) x (Adjusted Gross Score - Course Rating - PCC)
  function scoreDifferential(round){
    var slope = parseFloat(round.slope);
    var rating = parseFloat(round.rating);
    var score = parseFloat(round.score);
    if(!slope || isNaN(rating) || isNaN(score)) return null;
    return (113 / slope) * (score - rating);
  }

  // WHS lookup: how many of the lowest differentials to average, and any adjustment
  function whsRule(n){
    if(n < 3) return null;
    if(n === 3) return {count:1, adj:-2.0};
    if(n === 4) return {count:1, adj:-1.0};
    if(n === 5) return {count:1, adj:0};
    if(n === 6) return {count:2, adj:-1.0};
    if(n <= 8) return {count:2, adj:0};
    if(n <= 11) return {count:3, adj:0};
    if(n <= 14) return {count:4, adj:0};
    if(n <= 16) return {count:5, adj:0};
    if(n <= 18) return {count:6, adj:0};
    if(n === 19) return {count:7, adj:0};
    return {count:8, adj:0};
  }

  // Index from a list of rounds (oldest→newest); uses the most recent 20
  function handicapIndex(rounds){
    var diffs = rounds.map(scoreDifferential).filter(function(d){ return d !== null; });
    if(diffs.length < 3) return null;
    var recent = diffs.slice(-20);
    var rule = whsRule(recent.length);
    if(!rule) return null;
    var sorted = recent.slice().sort(function(a,b){ return a-b; });
    var lowest = sorted.slice(0, rule.count);
    var avg = lowest.reduce(function(a,b){ return a+b; }, 0) / lowest.length;
    return Math.round((avg + rule.adj) * 10) / 10;
  }

  /* ---------- Minimal inline SVG line chart ---------- */

  function lineChart(values, opts){
    opts = opts || {};
    var W = 600, H = 190, padL = 38, padR = 12, padT = 14, padB = 26;
    if(!values.length){
      return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="No data yet">' +
             '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="#8C8672" ' +
             'font-family="IBM Plex Mono, monospace" font-size="13">Not enough rounds yet</text></svg>';
    }
    var nums = values.map(function(v){ return v.y; });
    var min = Math.min.apply(null, nums);
    var max = Math.max.apply(null, nums);
    if(min === max){ min -= 1; max += 1; }
    var range = max - min;
    min -= range * 0.12; max += range * 0.12;
    range = max - min;

    var plotW = W - padL - padR, plotH = H - padT - padB;
    function px(i){ return values.length === 1 ? padL + plotW/2 : padL + (i/(values.length-1))*plotW; }
    function py(v){ return padT + plotH - ((v - min)/range)*plotH; }

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opts.aria||'Trend chart')+'">';

    // horizontal gridlines + y labels
    for(var g=0; g<=3; g++){
      var val = min + (range * g/3);
      var y = py(val);
      svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#DECDA0" stroke-width="1"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" fill="#8C8672" ' +
             'font-family="IBM Plex Mono, monospace" font-size="10">'+val.toFixed(opts.decimals != null ? opts.decimals : 0)+'</text>';
    }

    // area + line
    if(values.length > 1){
      var linePts = values.map(function(v,i){ return px(i)+','+py(v.y); }).join(' ');
      var areaPts = padL+','+(padT+plotH)+' ' + linePts + ' ' + (px(values.length-1))+','+(padT+plotH);
      svg += '<polygon points="'+areaPts+'" fill="'+(opts.fill||'rgba(38,64,44,0.10)')+'"/>';
      svg += '<polyline points="'+linePts+'" fill="none" stroke="'+(opts.stroke||'#26402C')+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    // points
    values.forEach(function(v,i){
      svg += '<circle cx="'+px(i)+'" cy="'+py(v.y)+'" r="3.5" fill="'+(opts.stroke||'#26402C')+'"/>';
    });
    // x labels: first, middle, last only (keeps it readable)
    var idxs = values.length <= 3 ? values.map(function(_,i){ return i; })
                                  : [0, Math.floor((values.length-1)/2), values.length-1];
    idxs.forEach(function(i){
      svg += '<text x="'+px(i)+'" y="'+(H-8)+'" text-anchor="middle" fill="#8C8672" ' +
             'font-family="IBM Plex Mono, monospace" font-size="10">'+values[i].label+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function sparkline(values, w, h){
    w = w || 76; h = h || 24;
    if(values.length < 2){
      return '<svg viewBox="0 0 '+w+' '+h+'" class="spark"></svg>';
    }
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if(min === max){ min -= 1; max += 1; }
    var pts = values.map(function(v,i){
      var x = (i/(values.length-1))*(w-2)+1;
      var y = h - 2 - ((v-min)/(max-min))*(h-4);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    var last = values[values.length-1], first = values[0];
    var color = last >= first ? '#26402C' : '#B5432E';
    return '<svg viewBox="0 0 '+w+' '+h+'" class="spark" preserveAspectRatio="none">' +
           '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" ' +
           'stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  function barChart(items){
    var W = 600, H = 150, padL = 12, padR = 12, padT = 12, padB = 34;
    if(!items.length) return '';
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var barW = plotW / items.length * 0.56;
    var gap = plotW / items.length;
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Quality rate by phase">';
    svg += '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="#DECDA0" stroke-width="1"/>';
    items.forEach(function(it, i){
      var h = Math.max(2, (it.pct/100) * plotH);
      var x = padL + gap*i + (gap - barW)/2;
      var y = padT + plotH - h;
      svg += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="4" fill="#5C7F5E"/>';
      svg += '<text x="'+(x+barW/2)+'" y="'+(y-5)+'" text-anchor="middle" fill="#26402C" ' +
             'font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">'+it.pct+'%</text>';
      svg += '<text x="'+(x+barW/2)+'" y="'+(H-12)+'" text-anchor="middle" fill="#6B6550" ' +
             'font-family="IBM Plex Mono, monospace" font-size="10">'+it.label+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  /* ---------- Progress page ---------- */

  function phaseQuality(phase){
    var logged = 0, target = 0;
    phase.groups.forEach(function(g){
      g.days.forEach(function(day, di){
        day.drills.forEach(function(d, i){
          var t = repTarget(d);
          if(!t) return;
          target += t;
          logged += Math.min(state.quality[g.id + '-' + di + '-' + i] || 0, t);
        });
      });
    });
    return target ? Math.round((logged/target)*100) : 0;
  }

        var right = el('div');
        right.innerHTML = diff !== null
          ? '<span class="round-diff">Diff ' + diff.toFixed(1) + '</span>'
          : '<span class="round-diff">No rating/slope</span>';
        var del = el('button','btn ghost','Delete');
        del.type='button';
        del.style.padding='4px 10px'; del.style.fontSize='10.5px'; del.style.marginLeft='10px';
        del.addEventListener('click', async function(){
          state.rounds = state.rounds.filter(function(x){ return x.id !== r.id; });
          await saveRounds();
          renderMain();
        });
        right.appendChild(del);
        row.appendChild(right);
        histCard.appendChild(row);
      });
    }
    container.appendChild(histCard);
  }

  function todayISO(){
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }

  function fmtShort(iso){
    if(!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }

  function renderWarmup(container){
    var wi = state.activeWarmup || 0;
    var wu = WARMUPS[wi];

    // Header + Fri/Sat tabs
    var header = el('div','card');
    header.innerHTML =
      '<h2>Pre-Round Warm-Up</h2>' +
      '<p class="focus">Two different routines, because the two rounds have different jobs. Checklist clears itself each day.</p>';

    var tabs = el('div','day-tabs');
    tabs.style.marginTop = '4px';
    WARMUPS.forEach(function(w, i){
      var b = el('button','day-tab' + (i === wi ? ' active' : ''));
      b.type = 'button';
      b.innerHTML = '<span class="dt-day">' + w.short + '</span><span class="dt-tag">' + w.tag + '</span>';
      b.addEventListener('click', function(){
        state.activeWarmup = i;
        renderMain();
      });
      tabs.appendChild(b);
    });
    header.appendChild(tabs);
    container.appendChild(header);

    // Intent
    var intentCard = el('div','card');
    var ihead = el('div','day-head');
    ihead.innerHTML = '<span class="day-name">' + wu.time + '</span>' +
                      '<span class="day-title">' + wu.title + '</span>';
    intentCard.appendChild(ihead);
    intentCard.appendChild(el('p','day-focus', wu.intent));
    container.appendChild(intentCard);

    // Blocks
    wu.blocks.forEach(function(blk, bi){
      var card = el('div','card');
      var bhead = el('div','day-head');
      bhead.innerHTML = '<span class="day-name">' + blk.time + '</span>' +
                        '<span class="day-title">' + blk.name + '</span>';
      card.appendChild(bhead);
      if(blk.note) card.appendChild(el('p','day-focus', blk.note));

      card.appendChild(warmupItemList(wu, blk, bi, null));
      container.appendChild(card);
    });

    // Short on time + first tee
    var footCard = el('div','card');
    footCard.innerHTML =
      '<h2>If You\u2019re Running Late</h2>' +
      '<p class="focus">' + wu.shortOnTime + '</p>' +
      '<div class="firsttee"><span class="ft-label">On the first tee</span>' +
      '<span class="ft-text">' + wu.firstTee + '</span></div>';
    container.appendChild(footCard);

    // Reset
    var resetCard = el('div','card');
    var resetBtn = el('button','btn ghost','Reset Checklist');
    resetBtn.type = 'button';
    resetBtn.addEventListener('click', async function(){
      state.warmup = {};
      await saveWarmup();
      renderMain();
    });
    resetCard.appendChild(resetBtn);
    container.appendChild(resetCard);
  }

  function renderMetrics(container){
    var card = el('div','card');
    card.innerHTML = '<h2>Metrics</h2><p class="focus">Fill in your current numbers as you track them. Compared against the program\u2019s Week 6 and Week 12 targets.</p>';

    var table = document.createElement('table');
    table.className = 'metrics';
    var thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Metric</th><th>Baseline</th><th>Current</th><th>Week 6 Target</th><th>Week 12 Target</th></tr>';
    table.appendChild(thead);
    var tbody = document.createElement('tbody');

    METRICS.forEach(function(m){
      var tr = document.createElement('tr');
      var tdLabel = document.createElement('td'); tdLabel.textContent = m.label;
      var tdBaseline = document.createElement('td'); tdBaseline.className='target mono'; tdBaseline.textContent = m.baseline;
      var tdCurrent = document.createElement('td');
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Enter value';
      input.value = state.metrics[m.id] || '';
      input.addEventListener('change', function(){
        state.metrics[m.id] = input.value;
        saveMetrics();
      });
      tdCurrent.appendChild(input);
      var tdW6 = document.createElement('td'); tdW6.className='target'; tdW6.textContent = m.week6;
      var tdW12 = document.createElement('td'); tdW12.className='target'; tdW12.textContent = m.week12;
      tr.appendChild(tdLabel); tr.appendChild(tdBaseline); tr.appendChild(tdCurrent); tr.appendChild(tdW6); tr.appendChild(tdW12);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
    container.appendChild(card);
  }

  function renderMain(){
    var main = document.getElementById('main');
    main.innerHTML = '';
    var panel = el('div','panel active');

    if(!state.loaded){
      panel.appendChild(el('div','empty-state','Loading your progress...'));
      main.appendChild(panel);
      return;
    }

    if(state.active === 'overview') renderOverview(panel);
    else if(state.active === 'warmup') renderWarmup(panel);
    else if(state.active === 'progress') renderProgress(panel);
    else if(state.active === 'log') renderLog(panel);
    else if(state.active === 'metrics') renderMetrics(panel);
    else renderPhase(panel, state.active);

    main.appendChild(panel);
  }

  async function init(){
    renderTabs();
    renderMain();
    await loadStorage();
    renderTabs();
    renderMain();
  }

  init();
})();
</script>
</body>
</html>
